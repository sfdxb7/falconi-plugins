name: garmoosha-mail
version: 1.5.0
description: Lets an agent search, read and draft email using its app password or existing Hermes Google Workspace sign-in, and send once the person approves.
author: Umbrel (ported for Falconi)
provides_tools:
  - email_search
  - email_read
  - email_draft
  - email_propose_reply
  - email_propose_action
  - email_send
provides_hooks:
  - pre_tool_call
  - post_approval_response
